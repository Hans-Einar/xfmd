name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libfox-1.6-dev xvfb curl strace fonts-dejavu-core fonts-droid-fallback
      - run: ./tools/bootstrap_dependencies.sh
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXFMD_SANITIZERS=${{ matrix.sanitizer }} -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "$RUNNER_TEMP/xfmd-install"
